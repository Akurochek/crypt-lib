[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-edu"
version = "0.1.0"
description = "Учебная криптобиблиотека: паддинги, S/P-блоки, DES/AES/ГОСТ, режимы, хэши, классические шифры и криптоанализ"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Akurochek" }]
keywords = ["cryptography", "education", "gost", "aes", "padding"]

[project.urls]
Homepage = "https://github.com/Akurochek/crypt-lib"

[tool.setuptools]
packages = ["crypt"]
