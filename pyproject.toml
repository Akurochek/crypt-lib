[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-enu"
version = "0.2.0"
description = "Учебная криптобиблиотека: паддинги, DES/AES/ГОСТ, режимы, SHA-2/SHA-3/Стрибог, RSA, ECC, ГОСТ 34.10, классические шифры и криптоанализ"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Akurochek" }]
keywords = ["cryptography", "education", "gost", "aes", "padding"]

[project.urls]
Homepage = "https://github.com/Akurochek/crypt-lib"

[tool.setuptools]
packages = ["crypto_enu"]
